<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BX — Business X-Ray</title><style>
*{box-sizing:border-box}body{margin:0;background:#081016;color:#f4f7f8;font:14px/1.5 Arial,sans-serif}a{color:inherit;text-decoration:none}.nav{height:64px;display:flex;align-items:center;gap:24px;padding:0 5vw;position:sticky;top:0;background:#081016e8;border-bottom:1px solid #263640;z-index:3}.logo{font-size:24px;font-weight:900}.logo small{font-size:9px;margin-left:7px}.nav nav{margin-left:auto;display:flex;gap:20px;color:#aab6bd}.b{display:inline-block;padding:12px 16px;border:1px solid #41515c;border-radius:7px;font-weight:700}.gold{background:#e0ba68;color:#111;border-color:#f0d58e}.hero,.sec,.page{max-width:1180px;margin:auto;padding:70px 24px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}.ey{font-size:11px;letter-spacing:.12em;color:#a9b5bc}.hero h1,.page h1{font-size:clamp(42px,6vw,74px);line-height:1.02;margin:10px 0 20px;letter-spacing:-.05em}.lead{font-size:18px;color:#aeb9bf}.dash,.card{background:#0e1920;border:1px solid #293b47;border-radius:12px;padding:20px}.score{font-size:56px;font-weight:900}.pill{font-size:10px;background:#6d501b;color:#ffdf93;padding:7px 9px;border-radius:5px}.row{display:flex;justify-content:space-between;border-top:1px solid #273843;padding:11px 0}.sec{border-top:1px solid #263640}.sec h2{font-size:38px;letter-spacing:-.03em;margin:8px 0 24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card h3{margin:5px 0}.card p{color:#8fa0aa}.green{color:#67d391}.red{color:#ff6b61}.amber{color:#e6b04e}.bar{height:7px;background:#263640;border-radius:10px}.bar i{display:block;height:100%;background:#e0ba68;border-radius:10px}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.flow .card{padding:13px;min-height:110px}.flow b{display:block;margin-bottom:24px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.footer{border-top:1px solid #263640;padding:25px 5vw;color:#7f909a;display:flex;justify-content:space-between}.scan{max-width:760px;margin:auto;padding:70px 24px}.opt{padding:14px;border:1px solid #31434e;border-radius:8px;margin:8px 0;cursor:pointer}.opt:hover,.opt.on{border-color:#e0ba68}.portal{max-width:1180px;margin:auto;padding:50px 24px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:12px;border-bottom:1px solid #263640;text-align:left}.tag{border:1px solid #344650;border-radius:20px;padding:4px 7px;font-size:10px;margin-right:4px}@media(max-width:800px){.nav nav{display:none}.hero{grid-template-columns:1fr}.grid,.grid4{grid-template-columns:1fr 1fr}.flow{grid-template-columns:1fr 1fr}.hero h1,.page h1{font-size:44px}}@media(max-width:520px){.grid,.grid4{grid-template-columns:1fr}.nav>.b{display:none}.footer{display:block}}
</style></head><body><header class="nav"><a class="logo" href="/">BX<small>BUSINESS X-RAY</small></a><nav><a href="/xray">Продукт</a><a href="/board">Board</a><a href="/cases">Кейсы</a><a href="/intelligence">Аналитика</a><a href="/methodology">Методология</a></nav><a class="b gold" href="/quick-scan">НАЧАТЬ X-RAY →</a></header><main id="app"></main><footer class="footer"><b>BX · Business X-Ray</b><span>DATA → EVIDENCE → DECISION → ACTION → MONEY</span></footer><script>
const A=document.getElementById('app'),path=location.pathname.replace(/\/$/,'')||'/';
const H=(t,d,k='BUSINESS X-RAY')=>`<section class="page"><div class="ey">${k}</div><h1>${t}</h1><p class="lead">${d}</p><div class="actions"><a class="b gold" href="/quick-scan">НАЧАТЬ X-RAY →</a><a class="b" href="/sample-report">ПРИМЕР ОТЧЁТА</a></div></section>`;
function home(){A.innerHTML=`<section class="hero"><div><div class="ey">ВИДИМ БИЗНЕС ТАК, КАК ЕГО ДОЛЖЕН ВИДЕТЬ СОБСТВЕННИК</div><h1>Узнайте, где ваш бизнес теряет деньги.</h1><p class="lead">Business X-Ray анализирует финансы, продажи, операции, рынок, людей, налоги и риски — и показывает, какое решение даст максимальный экономический эффект.</p><div class="actions"><a class="b gold" href="/quick-scan">ПРОЙТИ BX QUICK SCAN →</a><a class="b" href="/sample-report">ПОСМОТРЕТЬ ПРИМЕР</a></div></div><div class="dash"><div style="display:flex;justify-content:space-between"><div><div class="ey">BX SCORE</div><div class="score">64<small>/100</small></div></div><span class="pill">GO WITH CONDITIONS</span></div><div class="row"><span>Data confidence</span><b>MEDIUM</b></div><div class="row"><span>Потенциал EBITDA</span><b>₽38–52M</b></div><div class="row"><span>Потенциал Cash</span><b>₽21–29M</b></div><div class="row"><span>Критических выводов</span><b>7</b></div></div></section><section class="sec"><div class="ey">02 · ПРОБЛЕМА</div><h2>В бизнесе редко отсутствуют данные. Обычно отсутствует единая картина.</h2><div class="grid">${['Выручка растёт. Денег больше не становится.','Продажи выполняют план. EBITDA падает.','Компания прибыльна. Cash заканчивается.','Маркетинг даёт лиды. Продажи не конвертируют.','Компания растёт. Собственник — ограничение.','Каждый директор видит проблему по-разному.'].map(x=>`<div class="card"><h3>${x}</h3></div>`).join('')}</div></section><section class="sec"><div class="ey">03 · ЦЕПОЧКА СТОИМОСТИ</div><h2>Рост выручки ещё не означает рост стоимости.</h2><div class="flow">${[['Revenue','+10%','green'],['Gross Profit','−2%',''],['EBITDA','−8%','red'],['Net Profit','−12%','red'],['Cash Flow','−18%','red'],['Enterprise Value','−25%','red']].map(x=>`<div class="card"><b>${x[0]}</b><strong class="${x[2]}">${x[1]}</strong></div>`).join('')}</div></section><section class="sec"><div class="ey">04 · EVIDENCE</div><h2>Каждый вывод должен выдержать вопрос: «Откуда вы это знаете?»</h2><div class="grid"><div class="card"><div class="score green">82%</div><p>Confidence</p></div><div class="card"><h3>Высокая доля скидок уничтожает маржу.</h3><span class="tag">FACT</span><span class="tag">CALCULATION</span><span class="tag">ASSUMPTION</span></div><div class="card"><p>Financial impact</p><h3>₽14–19M EBITDA</h3><p>Owner: Commercial Director</p></div></div></section><section class="sec"><div class="ey">05 · BX BOARD</div><h2>Одно решение. Несколько независимых взглядов.</h2><div class="grid"><div class="card"><h3>Commercial</h3><p class="green">ЗА: ускорим продажи.</p></div><div class="card"><h3>CFO / Operations / Market</h3><p class="red">ПРОТИВ: маржа, capacity, спрос.</p></div><div class="card"><h3>BOARD DECISION</h3><div class="score amber" style="font-size:34px">PILOT</div><p>Kill criterion: uplift &lt; 12%</p></div></div></section><section class="sec"><div class="ey">06 · ПРОДУКТЫ</div><h2>Начать с вопроса. Продолжить системой управления бизнесом.</h2><div class="grid">${[['BX Quick Scan','/quick-scan'],['Business X-Ray','/xray'],['BX Partner Board','/board'],['BX Cases','/cases'],['BX Intelligence','/intelligence'],['Client Portal Demo','/portal-demo']].map(x=>`<a class="card" href="${x[1]}"><h3>${x[0]}</h3><p>Открыть →</p></a>`).join('')}</div></section>`}
const basic={
'/xray':['Business X-Ray','Полная диагностика бизнеса: деньги, риски, ограничения и карта приоритетных действий.','PRODUCT'],
'/board':['BX Partner Board','Независимые функциональные заключения → конфликт → Red Team → решение собственнику.','DECISION INTELLIGENCE'],
'/cases':['Кейсы','До → диагноз → решение → действие → инвестиции → realized effect.','CASES'],
'/intelligence':['BX Intelligence','Рынок, сигналы, исследования и Board View — всегда с ответом «что это значит для собственника».','INTELLIGENCE'],
'/methodology':['Методология BX','FACT · CALCULATION · ASSUMPTION · EXTERNAL DATA · EXPERT JUDGMENT.','METHODOLOGY']};
function simple(p){let x=basic[p];A.innerHTML=H(x[0],x[1],x[2])+`<section class="sec"><div class="grid"><div class="card"><h3>DATA</h3><p>Собираем финансовые и операционные данные.</p></div><div class="card"><h3>EVIDENCE</h3><p>Проверяем качество и confidence.</p></div><div class="card"><h3>DECISION</h3><p>Привязываем действие к EBITDA, Cash и риску.</p></div></div></section>`}
function report(){A.innerHTML=H('Sample X-Ray · Industrial Company','Демонстрационный отчёт с вымышленными цифрами.','SAMPLE REPORT')+`<section class="sec"><div class="grid4"><div class="card"><p>Revenue</p><h3>₽1.84B</h3></div><div class="card"><p>EBITDA</p><h3>₽119M</h3></div><div class="card"><p>BX Score</p><h3>58/100</h3></div><div class="card"><p>Confidence</p><h3>74%</h3></div></div><table class="table"><tr><th>Finding</th><th>Potential</th><th>Decision</th></tr><tr><td>Pricing</td><td>₽24–31M EBITDA</td><td>GO</td></tr><tr><td>Inventory</td><td>₽31–47M Cash</td><td>PILOT</td></tr><tr><td>Sales productivity</td><td>₽18–27M EBITDA</td><td>GO WITH CONDITIONS</td></tr></table></section>`}
const qs=[['Что беспокоит больше всего?',['Прибыль','Cash','Продажи','Рост']],['Выручка?',['Снижается','Стабильна','Растёт <15%','Растёт >15%']],['Кассовые разрывы?',['Часто','Иногда','Редко','Нет']],['Есть управленческий P&L?',['Нет','Редко','Ежемесячно','Онлайн']],['Собственник нужен в большинстве решений?',['Да','Часто','Иногда','Нет']]];let step=0,ans=[];function scan(){step=0;ans=[];draw()}function draw(){if(step>=qs.length)return result();let q=qs[step];A.innerHTML=`<section class="scan"><div class="ey">BX QUICK SCAN · ${step+1}/${qs.length}</div><h2>${q[0]}</h2><div class="bar"><i style="width:${step/qs.length*100}%"></i></div><div class="dash" style="margin-top:20px">${q[1].map((o,i)=>`<div class="opt" data-v="${i}">${o}</div>`).join('')}<div class="actions"><button class="b gold" id="next">ДАЛЕЕ →</button></div></div></section>`;document.querySelectorAll('.opt').forEach(e=>e.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));e.classList.add('on')});document.getElementById('next').onclick=()=>{let e=document.querySelector('.opt.on');if(!e)return alert('Выберите ответ');ans.push(+e.dataset.v);step++;draw()}}function result(){let s=Math.round(40+ans.reduce((a,b)=>a+b,0)/(qs.length*3)*40);A.innerHTML=`<section class="scan"><div class="ey">PRELIMINARY RESULT</div><div class="dash"><div class="score">${s}<small>/100</small></div><span class="pill">DATA CONFIDENCE: LOW</span><div class="row"><span>Cash efficiency</span><b class="red">ATTENTION</b></div><div class="row"><span>Sales productivity</span><b class="amber">REVIEW</b></div><div class="row"><span>Owner dependency</span><b class="amber">REVIEW</b></div><p>Финансовый эффект не рассчитывается без первичных данных компании.</p><a class="b gold" href="/sample-report">ПОСМОТРЕТЬ ПРИМЕР X-RAY →</a></div></section>`}
function portal(){A.innerHTML=H('Client Portal Demo','Панель собственника: состояние бизнеса, деньги, решения и фактический эффект.','BX PORTAL')+`<section class="sec"><div class="grid4"><div class="card"><p>BX Score</p><h3>68/100</h3></div><div class="card"><p>Identified</p><h3>₽84M</h3></div><div class="card"><p>Realized</p><h3>₽27M</h3></div><div class="card"><p>Open decisions</p><h3>3</h3></div></div><div class="grid" style="margin-top:12px"><div class="card"><h3>Finance</h3><div class="bar"><i style="width:74%"></i></div></div><div class="card"><h3>Commercial</h3><div class="bar"><i style="width:58%"></i></div></div><div class="card"><h3>Cash</h3><div class="bar"><i style="width:49%"></i></div></div></div></section>`}
if(path=='/')home();else if(basic[path])simple(path);else if(path=='/quick-scan')scan();else if(path=='/sample-report')report();else if(path=='/portal-demo')portal();else if(path.startsWith('/solutions/'))A.innerHTML=H('BX Solution','Диагностика проблемы через экономику, риск и реализуемость.','SOLUTION');else A.innerHTML=H('Страница в разработке','Маршрут уже зарезервирован в архитектуре BX.','STAGING');
</script></body></html>
