<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BX — база лидов</title>
<link rel="stylesheet" href="/styles.css">
<style>
.leadsShell{width:min(1240px,calc(100% - 36px));margin:auto;padding:38px 0 90px}
.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}.top h1{font-size:48px;letter-spacing:-.05em;margin:6px 0 0}.topActions{display:flex;gap:9px;flex-wrap:wrap}
.warn{padding:12px 15px;border:1px solid #eadfbf;border-radius:12px;background:#fffaf0;color:#7a673c;margin-bottom:16px;font-size:13px}
.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:16px}.stage{padding:14px;border:1px solid var(--line);border-radius:14px;background:#f8faf9}.stage span{color:var(--muted);font-size:12px}.stage b{display:block;font-size:25px;margin-top:4px}
.layout{display:grid;grid-template-columns:330px 1fr;gap:14px}.list{padding:12px;max-height:780px;overflow:auto}.leadItem{padding:14px;border:1px solid var(--line);border-radius:13px;background:#fbfcfc;margin-bottom:9px;cursor:pointer;display:block}.leadItem:hover,.leadItem.on{border-color:#9fcac4;background:#f1f8f6}.leadItem b{display:block;font-size:15px}.leadItem span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.leadTags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{padding:4px 7px;border-radius:999px;background:white;border:1px solid var(--line);font-size:10px;color:#68777b}
.detail{padding:24px}.detail h2{font-size:36px;letter-spacing:-.04em;margin:7px 0 4px}.sub{color:var(--muted);margin-bottom:20px}.rows{display:grid}.row{display:grid;grid-template-columns:170px 1fr;gap:14px;padding:11px 0;border-top:1px solid var(--line)}.row span{color:var(--muted)}.row b{font-weight:750}
.research{margin-top:16px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.metric{padding:14px;border:1px solid var(--line);border-radius:12px;background:#f9fbfa}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{display:block;font-size:18px;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.signal,.idea{padding:13px;border:1px solid var(--line);border-radius:12px;background:#fbfcfc;margin-top:8px}.signal{border-left:4px solid var(--unknown)}.signal.good{border-left-color:var(--good)}.signal.warn{border-left-color:var(--warn)}.signal.bad{border-left-color:var(--bad)}.signal b{display:block}.signal span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.timeline{margin-top:16px}.event{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.event i{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#e7f2ef;color:var(--accent);font-style:normal;font-size:10px;font-weight:850}.event b{display:block}.event span{color:var(--muted);font-size:12px}
.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:900px){.pipeline{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.list{max-height:none}.metrics{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.top{display:block}.topActions{margin-top:14px}.pipeline,.metrics,.two{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:2px}}
</style>
</head>
<body>
<header class="nav"><div class="shell navin"><a class="brand" href="/">BX<small>ВНУТРЕННЯЯ БАЗА</small></a><nav class="menu"><a href="/company-check.html">Проверить компанию</a><a href="/leads.html">База лидов</a></nav><a class="btn ghost" href="/">На сайт</a></div></header>
<main class="leadsShell">
 <div class="warn"><b>Тестовый внутренний экран.</b> Перед использованием с реальными контактами клиентов его нужно закрыть авторизацией.</div>
 <div class="top"><div><div class="eyebrow">ВХОДЯЩИЕ КОМПАНИИ</div><h1>База лидов BX</h1></div><div class="topActions"><a class="btn primary" href="/company-check.html">+ ПРОВЕРИТЬ КОМПАНИЮ</a><button class="btn ghost" id="reload">Обновить</button></div></div>
 <div class="pipeline" id="pipeline"></div>
 <div class="layout"><div class="panel list" id="list"></div><div class="panel detail" id="detail"><div class="empty">Выберите компанию слева.</div></div></div>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let leads=[],selected=null,storage='';
const qs=new URLSearchParams(location.search);
async function load(){
 document.getElementById('list').innerHTML='<div class="empty">Загружаем...</div>';
 try{
  const r=await fetch('/api/leads');const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Ошибка');
  leads=j.leads||[];storage=j.storage||'';renderPipeline();renderList();
  const wanted=qs.get('lead');selected=leads.find(x=>x.id===wanted)||leads[0]||null;renderDetail();
 }catch(e){document.getElementById('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
function renderPipeline(){
 const stages=['Новая заявка','Связались','Запрос данных','Полная диагностика','Предложение'];
 document.getElementById('pipeline').innerHTML=stages.map(s=>'<div class="stage"><span>'+esc(s)+'</span><b>'+leads.filter(x=>(x.stage||'Новая заявка')===s).length+'</b></div>').join('');
}
function renderList(){
 if(!leads.length){document.getElementById('list').innerHTML='<div class="empty">Лидов пока нет.</div>';return}
 document.getElementById('list').innerHTML=leads.map(x=>`<a class="leadItem" data-id="${esc(x.id)}"><b>${esc(x.company||x.legalName||'Компания')}</b><span>${esc(x.legalName||'')} ${x.inn?'· ИНН '+esc(x.inn):''}</span><div class="leadTags"><span class="tag">${esc(x.stage||'Новая заявка')}</span><span class="tag">${esc(x.sourceType||x.source||'Сайт')}</span></div></a>`).join('');
 document.querySelectorAll('.leadItem').forEach(el=>el.onclick=()=>{selected=leads.find(x=>x.id===el.dataset.id);renderDetail()});
}
function researchBlock(r){
 if(!r)return '<div class="research"><div class="eyebrow">АВТОАНАЛИЗ</div><div class="idea">Автоматический анализ ещё не прикреплён.</div></div>';
 return `<div class="research"><div class="eyebrow">АВТОАНАЛИЗ ОТКРЫТЫХ ДАННЫХ</div>
  ${(r.metrics||[]).length?'<div class="metrics">'+r.metrics.map(m=>'<div class="metric"><span>'+esc(m.label)+'</span><b>'+esc(m.value)+'</b></div>').join('')+'</div>':'<div class="idea">Финансовых показателей недостаточно для числового снимка.</div>'}
  <div class="two"><div><div class="eyebrow">СИГНАЛЫ</div>${(r.signals||[]).map(x=>'<div class="signal '+esc(x.tone)+'"><b>'+esc(x.title)+'</b><span>'+esc(x.text)+'</span></div>').join('')||'<div class="idea">Нет уверенных автоматических сигналов.</div>'}</div>
  <div><div class="eyebrow">ГИПОТЕЗЫ</div>${(r.hypotheses||[]).map((x,i)=>'<div class="idea"><b>'+(i+1)+'.</b> '+esc(x)+'</div>').join('')||'<div class="idea">Нужно запросить первичные данные компании.</div>'}</div></div></div>`;
}
function renderDetail(){
 document.querySelectorAll('.leadItem').forEach(el=>el.classList.toggle('on',selected&&el.dataset.id===selected.id));
 if(!selected){document.getElementById('detail').innerHTML='<div class="empty">Выберите компанию слева.</div>';return}
 const area=selected.diagnostic&&selected.diagnostic.findings&&selected.diagnostic.findings[0]?selected.diagnostic.findings[0].area:'Предварительный интернет-анализ';
 document.getElementById('detail').innerHTML=`<div class="eyebrow">КАРТОЧКА ЛИДА</div><h2>${esc(selected.company||selected.legalName||'Компания')}</h2><div class="sub">${esc(selected.legalName||'')}${selected.inn?' · ИНН '+esc(selected.inn):''}</div>
 <div class="rows">
  <div class="row"><span>Карточка</span><b>${esc(selected.id)}</b></div>
  <div class="row"><span>Этап</span><b>${esc(selected.stage||'Новая заявка')}</b></div>
  <div class="row"><span>Приоритет</span><b>${esc(selected.qualification||'Не определён')}</b></div>
  <div class="row"><span>Источник</span><b>${esc(selected.source||'Сайт BX')}</b></div>
  <div class="row"><span>Запрос</span><b>${esc(selected.request||'Предварительный анализ')}</b></div>
  <div class="row"><span>Основной контекст</span><b>${esc(area)}</b></div>
  <div class="row"><span>Хранилище</span><b>${storage==='PostgreSQL'?'Постоянная база PostgreSQL':'Резервное хранилище'}</b></div>
 </div>
 ${researchBlock(selected.research)}
 <div class="timeline"><div class="eyebrow">ИСТОРИЯ</div>${(selected.events||[]).map((e,i)=>'<div class="event"><i>'+(i+1)+'</i><div><b>'+esc(e.title)+'</b><span>'+esc(e.detail)+'</span></div></div>').join('')}</div>`;
}
document.getElementById('reload').onclick=load;
load();
</script>
</body>
</html>
